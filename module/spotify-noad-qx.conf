# Spotify 去广告 | Quantumult X 远程 Rewrite 配置
# 独立于 module/spotify.conf；不覆盖或修改现有 Spotify 配置。
# 基于 Amlabort/MY_clash 的 spot-NoAd.module 转换。
# 保留原 spot-proto-ev3.js 中的 Premium/HiFi 相关权益响应改写；原模块注明音质不能设置为超高。
# Quantumult X 无法仅对 Spotify 域名拦截 QUIC。近似原规则需在主配置 [general] 加 udp_drop_list = QUIC，
# 这是全局设置，会影响所有应用的 QUIC，详见仓库 README。

hostname = spclient.wg.spotify.com, *spclient.spotify.com

# 原始规则: DOMAIN aet.spotify.com, REJECT
^https:\/\/aet\.spotify\.com(?::443)?(?:\/|$) url reject
# 屏蔽弹窗广告
^https:\/\/(spclient\.wg|.*-spclient)\.spotify\.com(?::443)?\/pendragon url reject
# 屏蔽设置界面会员信息（仅影响展示）
^https:\/\/.*-spclient\.spotify\.com(?::443)?\/pam-view-service\/ url reject
# 屏蔽 AI DJ
^https:\/\/.*37i9dQZF1EYkqdzj48dyYq url reject
# 删除 customize 请求中的 If-None-Match 请求头
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/user-customization-service\/v1\/customize$ url script-request-header https://raw.githubusercontent.com/liao96312/rules/master/js/spotify-qx-header.js
# 拦截 gabo 请求并返回空的 HTTP 200 响应
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/gabo-receiver-service url reject-200
# 原始 protobuf 会员权益响应改写脚本（上游脚本已有 Quantumult X bodyBytes 兼容）
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)$ url script-response-body https://raw.githubusercontent.com/Amlabort/MY_clash/refs/heads/main/files/lpx/js/spot-proto-ev3.js
# 去除搜索页广告数据
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/browsita\/v.\/browse url script-response-body https://raw.githubusercontent.com/liao96312/rules/master/js/spotify-noad-search-qx.js
# 去除首页广告数据
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/casita\/v.\/home\/default url script-response-body https://raw.githubusercontent.com/liao96312/rules/master/js/spotify-noad-home-qx.js
# 去除滚动页广告数据
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/scrollsita\/v.\/scroll\/spotify url script-response-body https://raw.githubusercontent.com/liao96312/rules/master/js/spotify-noad-scroll-qx.js
